name: Release

# Pushing a tag such as v1.0.0 builds every platform and opens a draft release to review and publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test tests/SeedPlacement.Tests -c Release
      - name: Publish
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/SeedPlacement.Desktop -c Release -r win-x64 -o out -p:Version="$version"
          mv out/SeedPlacementRandomizer.exe "SeedPlacementRandomizer-$version-win-x64.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: SeedPlacementRandomizer-*-win-x64.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          chmod +x packaging/macos/package.sh
          packaging/macos/package.sh osx-arm64 "$version" dist
          packaging/macos/package.sh osx-x64 "$version" dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Package
        # A tarball keeps the executable bit, which a plain download would lose.
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/SeedPlacement.Desktop -c Release -r linux-x64 -o out -p:Version="$version"
          chmod +x out/SeedPlacementRandomizer
          tar -czf "SeedPlacementRandomizer-$version-linux-x64.tar.gz" -C out SeedPlacementRandomizer
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: SeedPlacementRandomizer-*-linux-x64.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet workload install android
      - run: dotnet build src/SeedPlacement.Android -t:InstallAndroidDependencies -f net10.0-android -p:AcceptAndroidSDKLicenses=True
      - name: Package
        # The same key on every release lets a new APK install over the old one. Version codes must grow: 1.2.3 is 10203.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          dotnet publish src/SeedPlacement.Android -c Release -f net10.0-android -o out             -p:Version="$version" -p:ApplicationVersion="$code" -p:PhoneRelease=true             -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$PWD/release.keystore"             -p:AndroidSigningKeyAlias=seedplacement             -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
          mv out/*-Signed.apk "SeedPlacementRandomizer-$version-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: SeedPlacementRandomizer-*-android.apk

  release:
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then notes_arg=(--notes-file "$notes"); else notes_arg=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" assets/* --draft \
            --title "Seed Placement Randomizer ${GITHUB_REF_NAME#v}" "${notes_arg[@]}"
